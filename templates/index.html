    <script>
        let respostaCorretaGlobal = "";

        document.getElementById("form-frase").addEventListener("submit", async function (e) {
            e.preventDefault();

            const button = this.querySelector("button");
            button.classList.add("loading");
            button.innerText = "Gerando...";

            const formData = new FormData(this);

            const response = await fetch("/gerar", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            button.classList.remove("loading");
            button.innerText = "Gerar Frase";

            // salva resposta correta
            respostaCorretaGlobal = data.resposta_correta;

            document.getElementById("resultado").innerHTML = `
        <p><strong>Frase:</strong> ${data.frase}</p>

        <input type="text" id="resposta_usuario" placeholder="Digite a tradução completa">

        <button class="btn-verificar" onclick="validarResposta()">
            Verificar
        </button>

        <div id="feedback"></div>
    `;
        });

        function validarResposta() {

            const respostaUsuario = document.getElementById("resposta_usuario").value;

            if (respostaUsuario.trim().toLowerCase() === respostaCorretaGlobal.trim().toLowerCase()) {
                document.getElementById("feedback").innerHTML =
                    "<p style='color:green'>✅ Correto!</p>";
            } else {
                document.getElementById("feedback").innerHTML =
                    "<p style='color:red'>❌ Errado!</p>";
            }
        }
    </script>
